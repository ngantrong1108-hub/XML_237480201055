<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
var xhttp = new XMLHttpRequest();
xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        myFunction(this);
    }
};
xhttp.open("GET", "danhsachnhanvien.xml", true);
xhttp.send();

function myFunction(xml) {
    var x, y, z, i, newNode, newTitle, newText, xmlDoc, txt;
    xmlDoc = xml.responseXML;
    txt = "";
    x = xmlDoc.documentElement;
    
    newNode = xmlDoc.createElement("nhanvien");
    newTitle = xmlDoc.createElement("donvi");
    newText = xmlDoc.createTextNode("Hành chính");

    newTitle.appendChild(newText);

    newNode.appendChild(newTitle);

    y = xmlDoc.getElementsByTagName("nhanvien")[0];

    x.replaceChild(newNode, y);

    z = xmlDoc.getElementsByTagName("donvi");
    for (i = 0; i < z.length; i++) { 
        txt += z[i].childNodes[0].nodeValue + "<br>";
    }
    document.getElementById("demo").innerHTML = txt; 
}
</script>

</body>
</html>
