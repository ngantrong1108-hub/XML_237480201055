<!DOCTYPE html>
<html>
<body>
<h2>Tổng lương:</h2>
<p id="demo"></p>

<script>
var xhttp = new XMLHttpRequest();
xhttp.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
        myFunction(this);
    }
};
xhttp.open("GET","danhsachnhanvien.xml", true);
xhttp.send();

function myFunction(xml) {
    var xmlDoc = xml.responseXML;
    var x = xmlDoc.getElementsByTagName('luong');
    var tong = 0;
    for(var i=0;i<x.length;i++){
        tong += parseInt(x[i].childNodes[0].nodeValue);
    }
    document.getElementById("demo").innerHTML = tong;
}
</script>

</body>
</html>
